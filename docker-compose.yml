# Credenciales compartidas por db y api. Un .env local las sobrescribe sin este usamos los valores por defecto.
x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:-votaciones}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-votaciones}
  POSTGRES_DB: ${POSTGRES_DB:-votaciones_db}

services:
  db:
    image: postgres:16           
    environment: *postgres-env    
    ports:
      - "5432:5432"      
    volumes:
      - pgdata:/var/lib/postgresql/data  
      # Solo se ejecutan al inicializar un volumen vacío, en orden alfabético.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./db/init/create_test_database.sql:/docker-entrypoint-initdb.d/02_create_test_database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      <<: *postgres-env
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # La imagen slim no trae curl: se usa el propio Python para consultar /health.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Carga los datos de demostración a través de la API y termina. Es idempotente:
  # en arranques posteriores reutiliza lo que ya existe y no duplica votos.
  seed:
    image: python:3.12-slim
    volumes:
      - ./scripts:/scripts:ro
    command: ["python", "/scripts/seed_demo.py", "http://api:8000"]
    depends_on:
      api:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:                 
